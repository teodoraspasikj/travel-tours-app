name: CI - Build and Push Docker Images
on:
  push:
    branches: [ main ]
jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: ./travel-tours-backend
          file: ./travel-tours-backend/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/travel-app-backend:${{ matrix.suffix }}

      - name: Build and push frontend image (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: ./travel-tours-frontend
          file: ./travel-tours-frontend/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/travel-app-frontend:${{ matrix.suffix }}

  merge-manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest (backend)
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/travel-app-backend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/travel-app-backend:amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/travel-app-backend:arm64

      - name: Create and push multi-arch manifest (frontend)
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/travel-app-frontend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/travel-app-frontend:amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/travel-app-frontend:arm64