services:
  db:
    image: postgres:15-alpine
    container_name: travel_db
    environment:
      POSTGRES_DB: traveldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - travel-network

  backend:
    build: ./travel-tours-backend
    container_name: travel_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/traveldb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=secretpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    networks:
      - travel-network

  frontend:
    build: ./travel-tours-frontend
    container_name: travel_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - travel-network

volumes:
  pgdata:

networks:
  travel-network:
    driver: bridge